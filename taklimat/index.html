html[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F4F8; --panel:#FFFFFF; --panel2:#F6F8FB; --raised:#EAEEF4;
  --line:#D3DAE4; --line2:#B9C3D1;
  --ink:#0F172A; --ink2:#334155; --muted:#64748B;
  --gold:#A47A00; --gold2:#7F5F00; --sky:#1D4ED8;
  --good:#1B7A43; --good-bg:#E2F3E8; --warn:#A85A0A; --warn-bg:#FBEEDC;
  --bad:#B42323;  --bad-bg:#FBE5E5;  --idle:#94A3B8;
  --yel:#7F5F00; --hud:#FFFFFF; --bar1:#FFFFFF; --bar2:#F2F4F8; --thead:#E6EBF3; --zebra:rgba(15,23,42,.03);
  --bad-ink:#7F1D1D; --info-bg:#E2ECFB; --plat:#0B0F16;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bar2)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1500px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- jalur arahan ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:linear-gradient(180deg,var(--bar1),var(--bar2));border-bottom:2px solid var(--gold);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:1500px;margin:0 auto;display:flex;gap:16px;align-items:center}
.logo{flex:none;width:92px;height:92px;border-radius:18%;background:var(--logo) center/88% no-repeat var(--plat);filter:drop-shadow(0 0 6px rgba(143,184,238,.25))}
.mid{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 auto}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand b{font-family:var(--f-cond);font-size:2rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--yel);line-height:1.05}
.brand span{font-family:var(--f-cond);font-size:.92rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:600}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:6px;align-items:stretch;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chips .chip{text-align:center;padding:7px 6px;display:flex;align-items:center;justify-content:center}
.hud{flex:none;display:flex;gap:10px;align-items:stretch;background:var(--hud);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tema{display:grid;grid-template-columns:1fr;align-content:center;gap:4px;padding-left:10px;border-left:1px solid var(--line)}   /* v5.9: DARK dan LIGHT sama lebar */
.tema .tb{font-family:var(--f-cond);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:4px;border:1px solid var(--line2);background:var(--raised);color:var(--muted);cursor:pointer;min-width:62px}
.tema .tb.on{border-color:var(--gold);color:var(--gold2);background:var(--panel)}
.tema .tb:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.chip{font-family:var(--f-cond);font-size:.68rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:5px 11px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);background:var(--raised);white-space:nowrap;cursor:default}
button.chip{cursor:pointer}
button.chip:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.chip.live{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.chip.demo{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.clock{display:flex;flex-direction:column;justify-content:center;text-align:left;line-height:1.1;padding:0 6px;min-width:190px}
.clock .t{font-family:var(--f-mono);font-size:1.95rem;font-weight:700;letter-spacing:.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.clock .d{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.clock .f{display:none;font-family:var(--f-mono);font-size:.6rem;color:var(--bad);margin-top:3px}
.clock .f.stale{display:block}


/* ---------- v5.4.2: pautan bar atas dan panel TUGAS ---------- */
a.chip.lnk{text-decoration:none;cursor:pointer;border-style:dashed;color:var(--sky)}
a.chip.lnk:hover{border-color:var(--sky);background:var(--panel2)}
.tugas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}   /* v5.8: empat lajur sama, baris dikongsi */
.tugas .kol{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;display:grid;grid-row:span 3;grid-template-rows:subgrid}
.tugas .kol .isi{min-width:0;padding-bottom:4px}
@media(max-width:1279px){.tugas{grid-template-columns:repeat(2,minmax(0,1fr))}}   /* v5.8: dua lajur sebaris pada skrin sempit */
@media(max-width:760px){.tugas{display:flex;flex-direction:column;gap:14px}.tugas .kol{display:flex;flex-direction:column;gap:8px}}
.tugas h3{margin:0 0 6px;font-family:var(--f-cond);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.tugas h3.lagi{margin-top:12px}
.ti{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--ink2)}
.ti:last-child{border-bottom:0}
.ti input{margin:3px 0 0;width:15px;height:15px;flex:0 0 auto;accent-color:var(--good);cursor:pointer}
.ti .tj{font-family:var(--f-mono);font-size:.74rem;color:var(--gold2);flex:0 0 54px;padding-top:1px}   /* v5.8: empat lajur */
.ti.done{color:var(--muted);text-decoration:line-through}
.tugas .kol > .lk{justify-content:center;text-align:center;margin:0}   /* v5.7.1: dua butang setiap lajur, sebaris sama tinggi */
.jangan{margin-top:12px;padding:9px 14px;border-radius:8px;border:1px solid var(--bad);background:var(--bad-bg);font-size:.84rem;color:var(--ink2)}
.jangan b{font-family:var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-right:8px;font-size:.7rem}
.tugashead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tugashead h2{margin:0}
.tugashead .reset{font-family:var(--f-cond);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:4px;padding:4px 10px;cursor:pointer}
.tugashead .reset:hover{color:var(--ink);border-color:var(--ink2)}

/* ---------- v5.9.5: paparan Jadual ---------- */
#btnJadual{display:none}   /* skrin lebar: Jadual dari side panel, bar atas kekal satu baris; chip Jadual hanya bila side panel tersembunyi */
@media(max-width:980px){#btnJadual{display:flex}}
.jsesi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 14px}
.jpra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 14px}   /* v5.9.13: pra-acara Jumaat */
@media(max-width:860px){.jpra{grid-template-columns:1fr}}
.jpraT{margin:14px 0 0;font-family:var(--f-cond);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.praDash{padding:12px 16px;margin-bottom:14px;border-color:var(--sky)} .praDash h2{margin:0 0 4px} .praDash .jpra{margin:6px 0 0}   /* tiga kad sama lebar dan tinggi */
@media(max-width:860px){.jsesi{grid-template-columns:1fr;grid-auto-rows:1fr}}   /* satu lajur: semua kad sama tinggi */
.jsk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.jsk.on{border-color:var(--good)}
.jsk > .st{display:block;width:100%;text-align:center;box-sizing:border-box}   /* chip status selebar kad: sama lebar dalam semua kad */
.jsk .jh{font-family:var(--f-cond);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jsk .jt{font-family:var(--f-mono);font-size:1.15rem;font-weight:700;color:var(--ink)}
.jsk .ja{font-size:.88rem;color:var(--ink2)}
.jsk .jg{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);font-family:var(--f-cond);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1279px){.jsk .jt{font-size:1rem}}
.jtab{table-layout:fixed;min-width:860px}
.jtab tbody td{height:58px;box-sizing:border-box;padding:7px 10px}   /* semua baris sama tinggi */
.jtab td.jno{text-align:center}
.jtab td.jno b{display:block;font-family:var(--f-mono);font-size:1.05rem;color:var(--gold2);line-height:1.2}
.jtab td.jno small{display:block;font-family:var(--f-cond);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.jtab tr.jbatas td{border-top:2px solid var(--gold)}   /* sempadan Hari 1 malam dan Hari 2 pagi */
.jtab td.sj{max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jtab td.sj small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jtab .jhk{display:flex;align-items:center}
.jtab .jl{display:block;font-family:var(--f-mono);font-size:.62rem;color:var(--good);margin-top:3px;white-space:nowrap}
.jtab .jl.w{color:var(--warn)}
.jtab .jbelum{margin-top:0}
