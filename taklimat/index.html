<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Taklimat CDKK @FESMA 2026</title>
<meta name="description" content="Slaid taklimat Urusetia Kehakiman, Panel Hakim dan Juri Awam. CDKK @FESMA 2026, 6 hingga 8 November, UIS Bangi.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ms_MY">
<meta property="og:site_name" content="CDKK @FESMA 2026">
<meta property="og:title" content="Taklimat CDKK @FESMA 2026">
<meta property="og:description" content="Slaid taklimat Urusetia Kehakiman, Panel Hakim dan Juri Awam. Pilih tab di atas.">
<meta property="og:url" content="https://brotaufik.github.io/cdkk-portal-2026/taklimat/">
<meta property="og:image" content="https://brotaufik.github.io/cdkk-portal-2026/taklimat/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Taklimat CDKK @FESMA 2026">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://brotaufik.github.io/cdkk-portal-2026/taklimat/og.jpg">
<meta name="theme-color" content="#0B1220">
<style>
:root{--bg:#0B1220;--bar:#111B2E;--line:#243550;--ink:#E6EDF7;--muted:#8FA3C0;--gold:#E8B84B;--uk:#E8B84B;--hk:#22E4FF;--ja:#FF3EA5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;padding-top:env(safe-area-inset-top);z-index:10}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;margin-right:6px}
.brand b{font-size:13px;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.brand span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 12.5px/1 inherit;letter-spacing:.04em;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.tab:hover{border-color:var(--c)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#0B1220}
.tab[aria-selected="true"] i{background:#0B1220;box-shadow:none}
.full{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 11.5px/1 inherit;padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.full:hover{color:var(--ink);border-color:var(--muted)}
.stage{position:fixed;top:52px;left:0;right:0;bottom:0;background:#000}
.stage iframe{width:100%;height:100%;border:0;display:block;background:#0B1220}
.stage iframe[hidden]{display:none}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--muted);font-size:14px;text-align:center;line-height:1.6;max-width:360px;padding:0 20px}
@media (max-width:640px){.brand span{display:none}.brand b{font-size:12px}.full{display:none}.bar{padding-left:10px}}
</style>
</head>
<body>
<header class="bar" role="tablist" aria-label="Pilih taklimat">
  <div class="brand"><b>TAKLIMAT CDKK @FESMA 2026</b><span>6 hingga 8 November 2026 · UIS Bangi · pilih tab, kemudian anak panah atau SPACE</span></div>
  <nav class="tabs">
    <button class="tab" role="tab" data-k="urusetia" style="--c:var(--uk)"><i></i>Urusetia Kehakiman</button>
    <button class="tab" role="tab" data-k="hakim" style="--c:var(--hk)"><i></i>Panel Hakim</button>
    <button class="tab" role="tab" data-k="juri" style="--c:var(--ja)"><i></i>Juri Awam</button>
  </nav>
  <button class="full" id="full" title="Slaid memenuhi skrin (Esc untuk keluar)">&#x26F6; Skrin penuh</button>
</header>
<main class="stage" id="stage">
  <div class="hint" id="hint">Memuatkan slaid&hellip;</div>
  <iframe id="f-urusetia" title="Taklimat Urusetia Kehakiman" allowfullscreen hidden></iframe>
  <iframe id="f-hakim" title="Taklimat Panel Hakim" allowfullscreen hidden></iframe>
  <iframe id="f-juri" title="Taklimat Juri Awam" allowfullscreen hidden></iframe>
</main>
<script>
(function(){
  var SRC={urusetia:'urusetia.html',hakim:'hakim.html',juri:'juri.html'};
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var hint=document.getElementById('hint');
  function pilih(k,tulis){
    if(!SRC[k])k='urusetia';
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.k===k?'true':'false')});
    Object.keys(SRC).forEach(function(j){
      var f=document.getElementById('f-'+j);
      if(j===k){if(!f.getAttribute('src')){f.setAttribute('src',SRC[j]);f.addEventListener('load',function(){hint.hidden=true;try{f.contentWindow.focus()}catch(e){}})}else{hint.hidden=true}f.hidden=false;try{f.contentWindow.focus()}catch(e){}}
      else f.hidden=true;
    });
    document.title={urusetia:'Taklimat Urusetia Kehakiman',hakim:'Taklimat Panel Hakim',juri:'Taklimat Juri Awam'}[k]+' · CDKK @FESMA 2026';
    if(tulis){try{history.replaceState(null,'','#'+k)}catch(e){location.hash=k}}
    try{localStorage.setItem('cdkk:taklimat:tab',k)}catch(e){}
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){pilih(t.dataset.k,true)})});
  document.getElementById('full').addEventListener('click',function(){
    var k=(location.hash||'').replace('#','')||'urusetia';var f=document.getElementById('f-'+k);
    var el=f||document.documentElement;var r=el.requestFullscreen||el.webkitRequestFullscreen;if(r)r.call(el);
  });
  window.addEventListener('hashchange',function(){pilih((location.hash||'').replace('#',''),false)});
  var awal=(location.hash||'').replace('#','');
  if(!SRC[awal]){try{awal=localStorage.getItem('cdkk:taklimat:tab')||''}catch(e){}}
  pilih(SRC[awal]?awal:'urusetia',true);
})();
</script>
</body>
</html>
